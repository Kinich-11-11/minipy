<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <title>鹈鹕的海边骑行 · Pelican Day Trip</title>
  <style>
    :root { color-scheme: light; --paper: #f7f5ee; --ink: #283f39; --muted: #7a8880; --accent: #df8056; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1160px, calc(100% - 80px)); margin: 0 auto; }
    header { height: 94px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #283f3918; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon { width: 39px; height: 39px; }
    .brand-name { font-size: 13px; letter-spacing: 2.7px; font-weight: 700; }
    .brand-sub { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }
    .edition { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
    .intro { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 42px 0 30px; }
    .eyebrow { font-size: 10px; letter-spacing: 2.5px; color: var(--muted); margin: 0 0 13px; }
    h1 { font-family: Georgia, "Songti SC", SimSun, serif; font-size: clamp(26px, 3.2vw, 41px); font-weight: 500; letter-spacing: 3px; margin: 0 0 13px; }
    h1 span { color: var(--accent); }
    .description { color: var(--muted); font-size: 12px; letter-spacing: 1.5px; margin: 0; line-height: 1.8; }
    .ride-status { display: flex; align-items: center; gap: 8px; border: 1px solid #283f3920; padding: 9px 14px; border-radius: 30px; font-size: 11px; white-space: nowrap; }
    .status-dot { background: #669680; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 4px #66968012; }
    .ride-status.paused .status-dot { background: #c29967; box-shadow: 0 0 0 4px #c2996712; }
    .scene-wrap { position: relative; border-radius: 15px; overflow: hidden; background: #e1ebe3; border: 1px solid #283f390b; }
    #scene { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; top: 24px; left: 27px; font-size: 9px; letter-spacing: 2px; color: #4f736b; display: flex; align-items: center; gap: 9px; }
    .scene-label::before { content: ""; width: 18px; height: 1px; background: #4f736b; }
    .scene-note { position: absolute; right: 27px; bottom: 20px; font-size: 9px; letter-spacing: 2px; color: #817765; }
    .controls { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #283f3918; gap: 20px; }
    .transport { display: flex; align-items: center; gap: 9px; }
    .play-button, .reset-button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; border-radius: 30px; transition: background .18s, transform .18s; }
    .play-button { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); padding: 11px 18px; min-width: 104px; font-size: 11px; letter-spacing: 1px; }
    .play-button:hover { background: #3c5a50; }
    .reset-button { width: 38px; height: 38px; background: transparent; border: 1px solid #283f3928; color: var(--ink); }
    .reset-button:hover { background: #e9ece2; }
    button:active { transform: scale(.96); }
    button svg { width: 14px; height: 14px; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .speed-control { display: flex; align-items: center; gap: 15px; color: var(--muted); font-size: 11px; }
    input[type="range"] { width: 135px; height: 3px; accent-color: #53786a; cursor: pointer; }
    #speedValue { color: var(--ink); min-width: 34px; font-variant-numeric: tabular-nums; }
    footer { display: flex; align-items: center; justify-content: space-between; padding: 19px 0 28px; font-size: 9px; color: var(--muted); letter-spacing: 1.3px; gap: 10px; }
    .footer-caption { display: flex; align-items: center; gap: 8px; }
    .footer-caption svg { width: 13px; height: 13px; }
    .outline { stroke: #344e45; stroke-linejoin: round; stroke-linecap: round; }
    @media (min-width: 1500px) { .page { margin-top: 18px; } }
    @media (max-width: 640px) {
      .page { width: calc(100% - 32px); }
      header { height: 76px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .brand-name { font-size: 11px; letter-spacing: 1.5px; }
      .brand-sub { font-size: 8px; }
      .intro { padding: 29px 0 23px; align-items: flex-start; }
      .ride-status { margin-top: 4px; padding: 8px 10px; font-size: 9px; }
      h1 { font-size: 25px; letter-spacing: 1px; }
      .description { font-size: 10px; letter-spacing: .5px; max-width: 240px; }
      .eyebrow { font-size: 8px; letter-spacing: 1.6px; }
      .scene-wrap { border-radius: 10px; }
      #scene { min-height: 300px; object-fit: cover; }
      .scene-label { top: 16px; left: 16px; font-size: 7px; }
      .scene-note { right: 14px; bottom: 14px; font-size: 7px; letter-spacing: 1px; }
      .controls { gap: 10px; padding: 17px 0; }
      .speed-control { gap: 8px; font-size: 10px; }
      input[type="range"] { width: 80px; }
      .play-button { padding: 10px 13px; min-width: 91px; }
      footer { font-size: 8px; letter-spacing: .5px; }
    }
    @media (max-width: 390px) { .ride-status { display: none; } .speed-control label { display: none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const ns = 'http://www.w3.org/2000/svg';
      const $ = id => document.getElementById(id);
      const layers = [];
      const add = (parent, tag, attributes) => {
        const element = document.createElementNS(ns, tag);
        for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
        parent.appendChild(element);
        return element;
      };
      const repeatLayer = (id, width, factor, populate) => {
        const parent = $(id);
        for (let tile = -1; tile <= Math.ceil(1200 / width) + 1; tile++) {
          const group = add(parent, 'g', { transform: `translate(${tile * width} 0)` });
          populate(group);
        }
        layers.push({ element: parent, width, factor });
      };
      repeatLayer('clouds', 1400, .065, group => {
        [[128, 116, 1.1], [368, 73, .75], [750, 99, 1.25], [1128, 205, .6]].forEach(([x, y, s]) => add(group, 'use', { href: '#cloud', transform: `translate(${x} ${y}) scale(${s})` }));
      });
      repeatLayer('hills', 1200, .12, group => add(group, 'use', { href: '#hillTile' }));
      repeatLayer('waves', 1200, .25, group => {
        for (let i = 0; i < 14; i++) {
          const x = i * 93 + (i % 2) * 17;
          const y = 414 + (i % 3) * 12;
          add(group, 'path', { d: `M${x} ${y}h${22 + (i % 4) * 13}` });
        }
      });
      repeatLayer('dunes', 1200, .42, group => add(group, 'use', { href: '#duneTile' }));
      repeatLayer('vegetation', 1600, .64, group => {
        [[108, 433, 1.05], [161, 449, .65], [1038, 445, .88], [1101, 459, .55], [1480, 448, .75]].forEach(([x, y, s]) => add(group, 'use', { href: '#pine', transform: `translate(${x} ${y}) scale(${s})` }));
        [[64, 502, .7], [231, 507, .65], [982, 510, .7], [1247, 500, .65]].forEach(([x, y, s]) => add(group, 'use', { href: '#grass', transform: `translate(${x} ${y}) scale(${s})` }));
        add(group, 'path', { d: 'M1195 500v-72m-32 0h69v25h-69Z', fill: '#ecdfbf', stroke: '#6f8775', 'stroke-width': 2, 'stroke-linejoin': 'round' });
        add(group, 'path', { d: 'M1174 441h45m-7-5 7 5-7 5', fill: 'none', stroke: '#6f8775', 'stroke-width': 2 });
      });
      repeatLayer('roadMarks', 240, 1, group => add(group, 'path', { d: 'M22 572H116' }));
      repeatLayer('roadDots', 600, 1, group => {
        [[27, 548], [113, 594], [215, 553], [305, 601], [388, 548], [502, 586]].forEach(([x, y]) => add(group, 'ellipse', { cx: x, cy: y, rx: 2.5, ry: 1 }));
      });
      repeatLayer('foreground', 1200, 1, group => {
        [[65, 531, 1], [275, 526, .55], [1029, 529, .8]].forEach(([x, y, s]) => add(group, 'use', { href: '#grass', transform: `translate(${x} ${y}) scale(${s})` }));
        [[96, 530, .7], [111, 532, .85], [922, 525, .6]].forEach(([x, y, s]) => add(group, 'use', { href: '#flower', transform: `translate(${x} ${y}) scale(${s})` }));
      });
      const frontLeg = $('frontLegPath');
      const backLeg = $('backLegPath');
      const frontCrank = $('frontCrank');
      const backCrank = $('backCrank');
      const frontFoot = $('frontFoot');
      const backFoot = $('backFoot');
      const rearSpokes = $('rearSpokes');
      const frontSpokes = $('frontSpokes');
      const chainSpokes = $('chainSpokes');
      const scarfTail = $('scarfTail');
      const blink = $('blink');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let running = !reducedMotion.matches;
      let speed = 1;
      let distance = 0;
      let rideTime = 0;
      let previousTime = null;
      const updateControls = () => {
        $('playText').textContent = running ? '暂停片刻' : '继续兜风';
        $('playButton').setAttribute('aria-label', running ? '暂停动画' : '播放动画');
        $('playButton').setAttribute('aria-pressed', String(!running));
        $('pauseIcon').style.display = running ? '' : 'none';
        $('playIcon').style.display = running ? 'none' : '';
        $('playIcon').toggleAttribute('hidden', running);
        $('rideStatus').classList.toggle('paused', !running);
        $('statusText').textContent = running ? '正在兜风' : '休息一下';
      };
      // 用两段固定长度的腿求膝关节，脚始终落在对应脚踏上。
      const drawLeg = (path, hipX, hipY, footX, footY) => {
        const upper = 76, lower = 78;
        const dx = footX - hipX, dy = footY - hipY;
        const length = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + length * length) / (2 * length);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx / length * along + dy / length * bend;
        const kneeY = hipY + dy / length * along - dx / length * bend;
        path.setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${footX} ${footY}`);
      };
      const render = () => {
        const wheelAngle = distance / 76;
        const crankAngle = wheelAngle / 1.75 - Math.PI / 2;
        const wheelDegrees = wheelAngle * 180 / Math.PI % 360;
        const crankDegrees = crankAngle * 180 / Math.PI % 360;
        rearSpokes.setAttribute('transform', `rotate(${wheelDegrees})`);
        frontSpokes.setAttribute('transform', `rotate(${wheelDegrees})`);
        chainSpokes.setAttribute('transform', `rotate(${crankDegrees})`);
        const x = 29 * Math.cos(crankAngle), y = 29 * Math.sin(crankAngle);
        const fx = 568 + x, fy = 437 + y;
        const bx = 568 - x, by = 437 - y;
        drawLeg(frontLeg, 528, 335, fx, fy);
        drawLeg(backLeg, 520, 333, bx, by);
        frontCrank.setAttribute('d', `M568 437L${fx} ${fy}`);
        backCrank.setAttribute('d', `M568 437L${bx} ${by}`);
        frontFoot.setAttribute('transform', `translate(${fx} ${fy})`);
        backFoot.setAttribute('transform', `translate(${bx} ${by})`);
        for (const layer of layers) layer.element.setAttribute('transform', `translate(${-distance * layer.factor % layer.width} 0)`);
        scarfTail.setAttribute('transform', `rotate(${Math.sin(rideTime * 5) * 3} 570 244)`);
        const blinking = rideTime % 5.7 > 5.5;
        blink.setAttribute('opacity', blinking ? '1' : '0');
      };
      const frame = time => {
        const dt = previousTime === null ? 0 : Math.min((time - previousTime) / 1000, .05);
        previousTime = time;
        if (running && !document.hidden) {
          distance += dt * 210 * speed;
          rideTime += dt * speed;
          render();
        }
        requestAnimationFrame(frame);
      };
      $('playButton').addEventListener('click', () => { running = !running; updateControls(); });
      $('resetButton').addEventListener('click', () => { distance = 0; rideTime = 0; render(); });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speedValue').value = `${speed.toFixed(2)}×`;
      });
      document.addEventListener('visibilitychange', () => { previousTime = null; });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { running = false; updateControls(); }
      });
      updateControls();
      render();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
