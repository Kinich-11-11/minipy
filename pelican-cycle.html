<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的海岸骑行</title>
<style>
  :root{color-scheme:light;--paper:#f8f5ed;--ink:#244f50;--muted:#7d8e86;--orange:#df764c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px}
  main{width:min(1120px,100%)}
  header{display:flex;justify-content:space-between;align-items:center;padding:0 3px 25px;border-bottom:1px solid #dcded2}
  .brand{font-size:12px;letter-spacing:3px;font-weight:700;display:flex;gap:12px;align-items:center}.brand svg{width:29px;height:29px}.issue{font-size:11px;letter-spacing:2px;color:var(--muted)}
  .intro{display:flex;justify-content:space-between;align-items:flex-end;padding:38px 3px 18px;gap:20px}
  .eyebrow{font-size:10px;letter-spacing:3px;color:var(--orange);font-weight:bold;margin:0 0 12px}
  h1{font-size:clamp(29px,4vw,46px);font-weight:500;letter-spacing:3px;margin:0 0 10px} .subtitle{font-size:13px;letter-spacing:1px;color:var(--muted);margin:0;line-height:1.9}
  .weather{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:11px;color:#70877b;padding-bottom:8px}.sun-icon{height:14px;width:14px;background:#e3ae59;border-radius:50%;box-shadow:0 0 0 4px #e3ae5918}
  .canvas{position:relative;border:1px solid #dfe3d6;border-radius:18px;overflow:hidden;background:#eaf1e8;margin-top:10px}.scene{width:100%;display:block;height:auto}.scene *{vector-effect:non-scaling-stroke}
  .scene-note{position:absolute;top:24px;left:26px;display:flex;gap:8px;align-items:center;color:#6c8b7f;font-size:10px;letter-spacing:2px}.dot{width:5px;height:5px;border-radius:50%;background:#7ba38f}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:23px 4px 19px}.transport{display:flex;align-items:center;gap:15px}button{font:inherit;cursor:pointer;touch-action:manipulation}.play{width:45px;height:45px;border-radius:50%;border:0;background:var(--ink);color:white;display:grid;place-items:center;transition:background .2s,transform .2s}.play:hover{background:#367071;transform:scale(1.05)}.play svg{width:16px;height:16px}.state{font-size:12px;letter-spacing:1px}.hint{font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1px}
  .speed-control{display:flex;align-items:center;gap:14px;font-size:11px;color:#70877b}.speed-control output{font-variant-numeric:tabular-nums;width:34px;color:var(--ink)}input[type=range]{width:130px;accent-color:var(--ink);cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #df764c;outline-offset:5px}
  footer{border-top:1px solid #dcded2;padding:18px 4px 0;display:flex;justify-content:space-between;color:#8a958a;font-size:10px;letter-spacing:1.5px}.little-wave{letter-spacing:5px;color:#88aaa0}
  @media(max-width:600px){body{padding:22px 16px}.issue{display:none}.intro{padding-top:28px;display:block}.weather{margin-top:15px}.scene{min-height:310px;object-fit:cover}.scene-note{left:17px;top:17px;font-size:8px}.controls{gap:12px}.speed-control{gap:7px}input[type=range]{width:80px}.hint{font-size:9px}footer{font-size:8px;letter-spacing:.5px}h1{letter-spacing:1px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" stroke="currentColor"/><path d="M6 19q5-5 10 0t10 0M9 23q4-4 8 0t6 0M12 12h8m-4-4v8" stroke="currentColor" stroke-linecap="round"/></svg>海岸慢游俱乐部</div>
    <span class="issue">LITTLE RIDES, BIG JOY &nbsp; / &nbsp; No. 001</span>
  </header>
  <section class="intro">
    <div><p class="eyebrow">THE PELICAN POST · 沿海漫游记</p><h1>海风正好，骑慢一点。</h1><p class="subtitle">一只鹈鹕，一辆单车，一整个无所事事的下午。</p></div>
    <div class="weather"><span class="sun-icon"></span>晴 · 海风轻拂 · 心情自由</div>
  </section>
  <div class="canvas">
    <div class="scene-note"><span class="dot"></span>在路上 / SOMEWHERE BY THE SEA</div>
    <svg class="scene" viewBox="0 0 1100 590" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">一只戴着帽子、系着围巾的鹈鹕骑自行车</title>
      <desc id="scene-desc">鹈鹕沿着海岸轻快骑行，双脚轮流踩踏板，车轮旋转，远处有太阳、帆船和缓缓移动的云朵。下方可以暂停动画或调节速度。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#eaf1e8"/><stop offset="1" stop-color="#f4f3dc"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#a9cfbf"/><stop offset="1" stop-color="#c5ddc8"/></linearGradient>
        <pattern id="water" width="220" height="52" patternUnits="userSpaceOnUse"><path d="M13 17h40m88 21h57M75 44h23" stroke="#eaf2db" stroke-width="2" stroke-linecap="round" opacity=".65"/></pattern>
        <pattern id="road" width="230" height="85" patternUnits="userSpaceOnUse"><path d="M20 38h67m98 0h12" stroke="#fbf7e8" stroke-width="4" stroke-linecap="round"/><path d="M120 69h23M49 9h17" stroke="#bdbda4" stroke-width="2" stroke-linecap="round" opacity=".5"/></pattern>
        <g id="wheel"><circle r="86" fill="#eaf0d9" fill-opacity=".28" stroke="#284b4d" stroke-width="9"/><circle r="77" fill="none" stroke="#faf6dc" stroke-width="3"/><g stroke="#6d9389" stroke-width="1.5"><path d="M-75 0H75M0-75V75M-53-53L53 53M-53 53L53-53M-29-69L29 69M-69-29L69 29M-69 29L69-29M-29 69L29-69"/></g><circle r="9" fill="#e7ead6" stroke="#284b4d" stroke-width="3"/><path d="M60-40l5 9" stroke="#e5af5f" stroke-width="5" stroke-linecap="round"/></g>
        <g id="grass" fill="none" stroke-linecap="round"><path d="M0 0q0-17-10-25M0 0q5-24 17-31M0 0q-14-13-22-12" stroke="#759c7e" stroke-width="3"/><path d="M3 0q12-11 22-10" stroke="#a3ad76" stroke-width="3"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0h1100v590H0z"/>
      <circle cx="843" cy="119" r="54" fill="#edc777"/><circle cx="843" cy="119" r="65" fill="none" stroke="#edc777" opacity=".22"/>
      <g id="clouds" fill="#fffdf0" opacity=".82"><path d="M125 137q3-20 23-20 6-29 31-22 22-2 26 26 23-5 29 16z"/><path d="M680 86q2-14 17-16 7-21 26-17 20 0 22 23 18-3 23 10z"/><path d="M947 196q4-14 19-13 8-20 25-14 16 1 18 18 13-2 18 9z"/></g>
      <g fill="none" stroke="#71968a" stroke-width="2" stroke-linecap="round" opacity=".65"><path d="M302 150q9-9 17 0 9-9 18-1M328 125q6-6 12 0 6-6 12 0"/></g>
      <path d="M0 292q110-49 237-18t220 1q107-46 228 3t219-8q96-29 196-12v100H0z" fill="#b7d0b8" opacity=".7"/>
      <path d="M0 312q236-16 424 0t676-5v121H0z" fill="url(#sea)"/>
      <path d="M0 328h1100v99H0z" fill="url(#water)" id="water-lines"/>
      <g id="boat" transform="translate(862 313)"><path d="M-27 0h54l-9 10h-31z" fill="#6e9486"/><path d="M0-65v63" stroke="#698e82" stroke-width="2"/><path d="M-4-60L-28-7h24z" fill="#fff9e4"/><path d="M3-48L24-7H3z" fill="#e6edda"/></g>
      <path d="M0 405q286-13 516 1t584-6v190H0z" fill="#e2dec2"/>
      <path d="M0 422q314-14 604 0t496-5" fill="none" stroke="#f8f1d6" stroke-width="7"/>
      <path d="M0 475h1100v85H0z" fill="#cfceb2"/>
      <path d="M0 475h1100v85H0z" fill="url(#road)" id="road-lines"/>
      <ellipse id="shadow" cx="520" cy="529" rx="205" ry="14" fill="#577369" opacity=".12"/>
      <g id="rider">
        <!-- The bicycle wheels and both legs share the same crank angle. -->
        <g transform="translate(382 437)"><g id="rear-wheel"><use href="#wheel"/></g></g>
        <g transform="translate(658 437)"><g id="front-wheel"><use href="#wheel"/></g></g>
        <path d="M293 422a92 92 0 0 1 175-26M571 402a92 92 0 0 1 171 5" fill="none" stroke="#89afa1" stroke-width="5" stroke-linecap="round"/>
        <path id="far-leg" d="M462 312L468 382L478 428" fill="none" stroke="#c99045" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="far-foot" fill="#c99045" stroke="#ac7b42" stroke-width="1.5"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M382 437L456 329L500 437H382L606 331L658 437M456 329L606 331" stroke="#285453" stroke-width="11"/>
          <path d="M382 437L456 329L500 437M456 329L606 331" stroke="#5d9690" stroke-width="5"/>
          <path d="M606 331L597 296q-3-12 11-15l23-3" stroke="#e8ead9" stroke-width="7"/>
          <path d="M619 279h18q12 0 12 11" stroke="#284b4d" stroke-width="8"/>
          <path d="M452 329l-7-22" stroke="#e8ead9" stroke-width="7"/>
          <path d="M425 307h42" stroke="#815d46" stroke-width="12"/>
          <path d="M610 289q32 7 24 72" stroke="#47756d" stroke-width="2"/>
          <path d="M382 437l118 15a16 16 0 0 0 0-31z" fill="#a7c0a8" stroke="#648b7c" stroke-width="2"/>
        </g>
        <circle cx="500" cy="437" r="19" fill="#f3ebcf" stroke="#285453" stroke-width="4"/>
        <g id="crank" stroke="#395d57" stroke-width="5" stroke-linecap="round"><path d="M475 437h50"/></g>
        <g id="pedal-far"><path d="M-12 4h24" stroke="#284b4d" stroke-width="6" stroke-linecap="round"/></g>
        <!-- Long bill, generous throat pouch, and a curved neck identify the pelican. -->
        <path d="M404 271l-57-17 30 39-37-1 51 25" fill="#f6f1dc" stroke="#567b70" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M386 268c1-41 33-59 67-54 25 4 34 15 35 1 3-27-10-39-5-62 4-23 17-34 35-34 24 0 37 18 33 36-2 18-20 28-27 45-12 29 8 52-4 83-13 32-46 48-82 40-31-6-49-21-52-55z" fill="#fffbed" stroke="#567b70" stroke-width="2.5"/>
        <path d="M397 282q25 34 66 28 34-5 44-28-9 42-50 41-40 0-60-41" fill="#e0e7d3"/>
        <path d="M534 149l108 4q-24 41-69 45-31-1-39-49z" fill="#edbc68" stroke="#9d884f" stroke-width="2"/>
        <path d="M537 144q49-5 114 10l-115 3z" fill="#e6a554" stroke="#a2854c" stroke-width="2" stroke-linejoin="round"/>
        <path d="M552 163q7 23 25 26" fill="none" stroke="#f7d792" stroke-width="3" stroke-linecap="round"/>
        <circle cx="525" cy="140" r="4" fill="#274c4c"/><circle cx="526" cy="139" r="1.2" fill="white"/>
        <path d="M519 128q6-4 12-1" fill="none" stroke="#567b70" stroke-width="2" stroke-linecap="round"/>
        <path d="M478 120q7-5 16-5l-1-18q25-15 44 2l1 18 16 6q-43 5-76-3z" fill="#698f81" stroke="#3d6b61" stroke-width="2.5"/>
        <path d="M493 108q23-5 44 3v7q-22-6-44-3z" fill="#e0b775"/>
        <g id="scarf-tail"><path d="M494 204q-38-20-84-7l10 10-14 12q47-15 84 0z" fill="#df764c" stroke="#b96043" stroke-width="2"/><path d="M475 207q-25-8-48-1" fill="none" stroke="#f3a079" stroke-width="2"/></g>
        <path d="M487 195q14 11 31 6l-2 14q-18 4-31-8z" fill="#df764c" stroke="#b96043" stroke-width="2"/>
        <path id="near-leg" d="M459 308L508 366L525 437" fill="none" stroke="#e5ae59" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="near-foot" fill="#e5ae59" stroke="#ad854b" stroke-width="1.5"/>
        <g id="pedal-near"><path d="M-12 5h24" stroke="#284b4d" stroke-width="6" stroke-linecap="round"/></g>
        <path d="M423 247q22-27 52-9 32 18 50 35 26 9 71 10-8 16-25 17-54 6-88-13-9 14-30 10-27-8-30-28" fill="#e7ebda" stroke="#567b70" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M440 252q16-8 37 13M437 265q19-6 35 10M442 278q13-1 23 4" fill="none" stroke="#b6cbb8" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g id="foreground"><use href="#grass" x="123" y="553"/><use href="#grass" x="913" y="569"/><use href="#grass" x="1051" y="451" transform="translate(315 135) scale(.7)"/><path d="M215 560h19m585 18h22" stroke="#b6b997" stroke-width="3" stroke-linecap="round"/></g>
      <g fill="none" stroke="#7d9f8e" stroke-width="2" stroke-linecap="round" opacity=".55" id="breeze"><path d="M265 240h48M280 251h18M712 228h39M733 239h34"/></g>
    </svg>
  </div>
  <section class="controls" aria-label="动画控制">
    <div class="transport"><button class="play" id="toggle" type="button" aria-label="暂停动画"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M5 4h3v12H5zM12 4h3v12h-3z"/></svg></button><div><div class="state" id="status" aria-live="polite">悠哉骑行中</div><div class="hint">把时间交给海风</div></div></div>
    <label class="speed-control" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度"><output id="speed-value" for="speed">1.0×</output></label>
  </section>
  <footer><span>不赶路，只感受路。 GO SLOW, FEEL MORE.</span><span class="little-wave" aria-hidden="true">∿ ∿ ∿</span><span>一段会循环的小小快乐</span></footer>
</main>
<script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let playing = !reducedMotion.matches, speed = 1, time = 0, previous = null;
    const nodes = Object.fromEntries(['rear-wheel','front-wheel','crank','rider','scarf-tail','clouds','boat','water','road','foreground','breeze','shadow'].map(id => [id, $(id)]));
    // Two-segment inverse kinematics keep each webbed foot attached to its pedal.
    function leg(side, angle) {
      const hip = {x: side === 'near' ? 460 : 468, y: 309};
      const foot = {x: 500 + Math.cos(angle) * 25, y: 437 + Math.sin(angle) * 25};
      const dx = foot.x - hip.x, dy = foot.y - hip.y, distance = Math.hypot(dx, dy);
      const upper = 85, lower = 86;
      const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
      const knee = {x: hip.x + dx * along / distance + dy * bend / distance, y: hip.y + dy * along / distance - dx * bend / distance};
      $(side + '-leg').setAttribute('d', `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y-5}`);
      $(side + '-foot').setAttribute('d', `M${foot.x-4} ${foot.y-9}Q${foot.x+6} ${foot.y-7} ${foot.x+15} ${foot.y-3}L${foot.x+20} ${foot.y+2}H${foot.x-10}Q${foot.x-13} ${foot.y-3} ${foot.x-4} ${foot.y-9}Z`);
      $('pedal-' + side).setAttribute('transform', `translate(${foot.x} ${foot.y})`);
    }
    function draw() {
      const angle = time * 2.8, degrees = angle * 180 / Math.PI;
      nodes['rear-wheel'].setAttribute('transform', `rotate(${degrees})`);
      nodes['front-wheel'].setAttribute('transform', `rotate(${degrees})`);
      nodes.crank.setAttribute('transform', `rotate(${degrees} 500 437)`);
      leg('near', angle); leg('far', angle + Math.PI);
      nodes.rider.setAttribute('transform', `translate(0 ${Math.sin(angle*2)*1.5})`);
      nodes['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(time*5)*4} 492 208)`);
      nodes.clouds.setAttribute('transform', `translate(${-((time*5)%1350)} 0)`);
      // Repeated cloud silhouettes cover the entire wrap-around interval.
      nodes.water.setAttribute('patternTransform', `translate(${-time*12%220} 0)`);
      nodes.road.setAttribute('patternTransform', `translate(${-time*240.8%230} 0)`);
      nodes.foreground.setAttribute('transform', `translate(${-time*240.8%1400} 0)`);
      nodes.boat.setAttribute('transform', `translate(${862-Math.sin(time*.08)*75} ${313+Math.sin(time*1.4)*2})`);
      nodes.breeze.setAttribute('opacity', .35 + Math.sin(time*2)*.15);
      nodes.shadow.setAttribute('rx', 205+Math.sin(angle*2)*2);
    }
    // Duplicate scrolling decorations once to make their loops seamless.
    for (const [id, span] of [['clouds',1350], ['foreground',1400]]) {
      const group = nodes[id];
      const copy = document.createElementNS('http://www.w3.org/2000/svg','g');
      copy.setAttribute('transform', `translate(${span} 0)`);
      Array.from(group.children).forEach(child => copy.appendChild(child.cloneNode(true)));
      group.appendChild(copy);
    }
    function updateControls() {
      $('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
      $('play-icon').setAttribute('d', playing ? 'M5 4h3v12H5zM12 4h3v12h-3z' : 'M6 3l11 7-11 7z');
      $('status').textContent = playing ? '悠哉骑行中' : '停下来，看看海';
    }
    $('toggle').addEventListener('click', () => {playing = !playing; previous = null; updateControls();});
    $('speed').addEventListener('input', event => {speed = Number(event.target.value); $('speed-value').value = speed.toFixed(2).replace(/0$/, '') + '×';});
    reducedMotion.addEventListener('change', event => {if(event.matches) {playing = false; updateControls();}});
    document.addEventListener('visibilitychange', () => {previous = null;});
    function frame(now) {
      if (previous !== null && playing && !document.hidden) time += Math.min((now-previous)/1000,.05)*speed;
      previous = now;
      if (playing) draw();
      requestAnimationFrame(frame);
    }
    draw(); updateControls(); requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
